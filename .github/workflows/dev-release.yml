name: Dev Release Zero

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to release'
        required: true
        default: 'main'
        type: string
      commit_sha:
        description: 'Commit SHA (optional; defaults to HEAD of branch)'
        required: false
        type: string

permissions: {}

concurrency:
  group: zero-dev-release-${{ inputs.branch }}-${{ inputs.commit_sha || 'head' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan dev release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      ref: ${{ steps.plan.outputs.ref }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Plan dev release
        id: plan
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
          COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: node scripts/src/dev-release-plan.ts

  verify-signed-commit-authors:
    name: Verify signed commit authors
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main branch
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main

      - name: Verify Signed Commit Authors
        uses: rocicorp/.github/.github/actions/verify-signed-commit-authors@b0bc55c1abf942d3c04a4fbe911f7882a90526b0 # main
        with:
          enforce: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          head-sha: ${{ needs.plan.outputs.source_sha }}
          base-ref: origin/main

  archive-cloudzero-source:
    name: Archive source for Cloud Zero (staging)
    runs-on: ubuntu-latest
    needs: [plan, verify-signed-commit-authors]
    environment: staging-source-archive
    permissions:
      contents: read
      id-token: write # For AWS OIDC.
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Configure archive credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::946232032425:role/github-archive-zero-source
          role-session-name: archive-zero-source-dev-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Archive source revision
        env:
          SOURCE_ARCHIVE_BUCKET: cloudzero-source-archives-946232032425
          SOURCE_REPOSITORY: rocicorp/mono
          SOURCE_REVISION: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse --verify "${SOURCE_REVISION}^{commit}")
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]] || [ "$revision" != "$SOURCE_REVISION" ]; then
            echo "Expected exact commit SHA, got $SOURCE_REVISION -> $revision" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/source.tar.gz"
          git archive --format=tar "$revision" | gzip -n > "$archive"
          key="repositories/$SOURCE_REPOSITORY/$revision/source.tar.gz"
          if aws s3api head-object --bucket "$SOURCE_ARCHIVE_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "Already archived $SOURCE_REPOSITORY@$revision"
          else
            aws s3api put-object \
              --bucket "$SOURCE_ARCHIVE_BUCKET" \
              --key "$key" \
              --body "$archive" \
              --content-type application/gzip \
              --checksum-algorithm SHA256 >/dev/null
          fi

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [plan, verify-signed-commit-authors]
    permissions:
      contents: read
    outputs:
      tarball_name: ${{ steps.pack.outputs.filename }}
    env:
      SCRIPTS: ${{ github.workspace }}/ci/scripts/src
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: ci
          persist-credentials: false
          sparse-checkout: scripts

      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build Zero
        working-directory: source
        run: pnpm --filter @rocicorp/zero run build

      - name: Pack Zero
        id: pack
        working-directory: source/packages/zero
        env:
          PACK_DEST: ${{ runner.temp }}/npm
        run: node "$SCRIPTS/release-pack.ts"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-npm-${{ needs.plan.outputs.image_tag }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/npm/${{ steps.pack.outputs.filename }}

  build-docker:
    name: Build Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [plan, verify-signed-commit-authors, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      PLATFORM: ${{ matrix.platform }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARBALL: ${{ needs.build.outputs.tarball_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zero-npm-${{ needs.plan.outputs.image_tag }}
          path: ${{ runner.temp }}/npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image archive
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/docker/zero-image-${{ matrix.arch }}.tar
          IMAGE_DIGEST: ${{ runner.temp }}/docker/zero-image-${{ matrix.arch }}.digest
          IMAGE_METADATA: ${{ runner.temp }}/docker/zero-image-${{ matrix.arch }}.json
          TARBALL_PATH: ${{ runner.temp }}/npm/${{ needs.build.outputs.tarball_name }}
        run: |
          set -euo pipefail
          mkdir -p source/packages/zero/pkgs "$(dirname "$IMAGE_ARCHIVE")"
          cp "$TARBALL_PATH" "source/packages/zero/pkgs/$TARBALL"
          docker buildx build \
            --platform "$PLATFORM" \
            --build-context monogo=source/go \
            --build-arg ZERO_VERSION="$IMAGE_TAG" \
            --build-arg ZERO_PACKAGE="$TARBALL" \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --label org.opencontainers.image.version="$IMAGE_TAG" \
            --metadata-file "$IMAGE_METADATA" \
            --sbom=true \
            --provenance=mode=max \
            --output=type=oci,dest="$IMAGE_ARCHIVE" \
            source/packages/zero
          digest=$(jq -r '."containerimage.digest"' "$IMAGE_METADATA")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid $ARCH image digest: $digest" >&2
            exit 1
          fi
          printf '%s\n' "$digest" > "$IMAGE_DIGEST"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zero-docker-${{ needs.plan.outputs.image_tag }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/docker/zero-image-${{ matrix.arch }}.tar
            ${{ runner.temp }}/docker/zero-image-${{ matrix.arch }}.digest

  publish-docker:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs:
      [
        plan,
        verify-signed-commit-authors,
        build-docker,
        archive-cloudzero-source,
      ]
    concurrency:
      group: zero-dev-release-tag-${{ needs.plan.outputs.image_tag }}
      cancel-in-progress: false
    environment:
      name: zero-release-docker
    permissions:
      id-token: write # For Docker Hub OIDC.
      packages: write # For GHCR pushes.
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - name: Download amd64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zero-docker-${{ needs.plan.outputs.image_tag }}-amd64
          path: dist/docker

      - name: Download arm64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zero-docker-${{ needs.plan.outputs.image_tag }}-arm64
          path: dist/docker

      - name: Read Docker image digests
        id: digests
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            digest=$(<"dist/docker/zero-image-$arch.digest")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid $arch image digest: $digest" >&2
              exit 1
            fi
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
          DOCKERHUB_OIDC_CONNECTIONID: 2b3442aa-9cf7-4a13-afce-535dece25f7a
        with:
          username: rocicorp

      - name: Push GHCR amd64 image by digest
        uses: docker://quay.io/containers/skopeo:v1.22.2-immutable@sha256:ca4fd94dba8cab15cf79c4c156bfc26d28e2265411294e9bba87756942e739ad
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/docker-auth/config.json
        with:
          args: >-
            copy --all --preserve-digests
            oci-archive:dist/docker/zero-image-amd64.tar
            docker://ghcr.io/rocicorp/zero@${{ steps.digests.outputs.amd64 }}

      - name: Push GHCR arm64 image by digest
        uses: docker://quay.io/containers/skopeo:v1.22.2-immutable@sha256:ca4fd94dba8cab15cf79c4c156bfc26d28e2265411294e9bba87756942e739ad
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/docker-auth/config.json
        with:
          args: >-
            copy --all --preserve-digests
            oci-archive:dist/docker/zero-image-arm64.tar
            docker://ghcr.io/rocicorp/zero@${{ steps.digests.outputs.arm64 }}

      - name: Push Docker Hub amd64 image by digest
        uses: docker://quay.io/containers/skopeo:v1.22.2-immutable@sha256:ca4fd94dba8cab15cf79c4c156bfc26d28e2265411294e9bba87756942e739ad
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/docker-auth/config.json
        with:
          args: >-
            copy --all --preserve-digests
            oci-archive:dist/docker/zero-image-amd64.tar
            docker://docker.io/rocicorp/zero@${{ steps.digests.outputs.amd64 }}

      - name: Push Docker Hub arm64 image by digest
        uses: docker://quay.io/containers/skopeo:v1.22.2-immutable@sha256:ca4fd94dba8cab15cf79c4c156bfc26d28e2265411294e9bba87756942e739ad
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/docker-auth/config.json
        with:
          args: >-
            copy --all --preserve-digests
            oci-archive:dist/docker/zero-image-arm64.tar
            docker://docker.io/rocicorp/zero@${{ steps.digests.outputs.arm64 }}

      - name: Create multi-platform Docker image tags
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/rocicorp/zero:$IMAGE_TAG" \
            "ghcr.io/rocicorp/zero@$AMD64_DIGEST" \
            "ghcr.io/rocicorp/zero@$ARM64_DIGEST"
          docker buildx imagetools create \
            --tag "docker.io/rocicorp/zero:$IMAGE_TAG" \
            "docker.io/rocicorp/zero@$AMD64_DIGEST" \
            "docker.io/rocicorp/zero@$ARM64_DIGEST"

      - name: Verify multi-platform Docker image tags
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
        run: |
          set -euo pipefail
          for image in \
            "ghcr.io/rocicorp/zero:$IMAGE_TAG" \
            "docker.io/rocicorp/zero:$IMAGE_TAG"; do
            platforms=$(docker buildx imagetools inspect "$image" --raw |
              jq -r '.manifests[].platform | select(.os == "linux") | .architecture' |
              sort -u | paste -sd, -)
            if [ "$platforms" != 'amd64,arm64' ]; then
              echo "Expected $image to contain linux/amd64 and linux/arm64, got: $platforms" >&2
              exit 1
            fi
          done

      - name: Summarize dev release
        run: |
          {
            printf '## Dev Release Ready\n\n'
            printf 'Target Image Tag: `%s`\n' "$IMAGE_TAG"
            printf 'Source Revision: `%s`\n\n' "$SOURCE_SHA"
            printf '### Docker Images:\n'
            printf -- '- Docker Hub: `rocicorp/zero:%s`\n' "$IMAGE_TAG"
            printf -- '- GHCR: `ghcr.io/rocicorp/zero:%s`\n\n' "$IMAGE_TAG"
            printf '### Deploy to CloudZero Staging:\n'
            printf 'Deploy this dev image to your staging stack via the CloudZero controller script:\n'
            printf '```bash\nnode update-stack-zero-version.ts %s stack-ids <stack-id>\n```\n' "$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
