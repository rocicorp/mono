name: JS Test Shards

# Reusable workflow that runs the vitest suite split into shards. Called once
# per test mode from js.yml; each call shows up as one grouped job ("Test no PG",
# "Test PG 18", ...) whose shards are the children.

on:
  workflow_call:
    inputs:
      pg-mode:
        description: Value for TEST_PG_MODE (nopg, pg-15, pg-16, ...)
        required: true
        type: string
      shards:
        description: JSON array of shard indices, 1-based (e.g. "[1, 2, 3]")
        required: false
        type: string
        default: '[1, 2, 3, 4]'

permissions:
  contents: read

jobs:
  shard:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      TEST_PG_MODE: ${{ inputs.pg-mode }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-
      - run: pnpm install --frozen-lockfile
      - if: inputs.pg-mode == 'nopg'
        uses: ./.github/actions/playwright-install
      - name: Compute shard count
        run: echo "SHARD_COUNT=$(jq length <<< "$SHARDS")" >> "$GITHUB_ENV"
      # On a pull request, run only the test files reachable from what changed.
      # Vitest resolves this from the module graph rather than from paths, so a
      # change to a widely imported module still fans out to every dependent --
      # editing shared/src/must.ts selects 439 of the 929 no-PG files, while a
      # leaf selects a handful.
      #
      # What the module graph cannot see, and so falls back to the full suite:
      # dependency and build config (a lockfile bump affects tests that import
      # nothing new), and vitest's own globalSetup and setupFiles, which no test
      # file imports -- editing zero-cache/test/pg-17.ts otherwise selects none
      # of the 97 pg-17 files.
      #
      # That leaves anything a test reads at runtime rather than importing.
      # merge_group and pushes to main always run everything, which is the
      # backstop -- a miss costs a red merge queue entry rather than a broken
      # main.
      - name: Select tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          since=''
          if [ "$EVENT" = pull_request ]; then
            # HEAD^1 is the base branch tip: pull_request builds check out the
            # merge commit, whose first parent is the base.
            # The pattern below has to keep covering whatever the vitest
            # configs declare as globalSetup or setupFiles, since nothing
            # imports those: today that is packages/zero-cache/test/ and
            # setup.ts, found with
            #   grep -rn 'setupFiles\|globalSetup' --include='vitest.config*.ts'
            #
            # stderr is discarded rather than captured, so that a warning on a
            # successful run cannot end up in the list being matched as a path.
            if ! changed=$(git diff --name-only HEAD^1 2>/dev/null); then
              # Deeper than the fetch, or not a merge commit. Rather than fail,
              # fall back to the behaviour we are trying to optimise.
              echo 'Cannot diff against the base commit: running the full suite.'
            elif printf '%s\n' "$changed" | grep -qE \
              '(^|/)(package\.json|tsconfig[^/]*\.json|vitest\.config[^/]*\.ts|setup\.ts|[^/]*-setup\.ts)$|^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$|^\.github/|^packages/zero-cache/test/'
            then
              echo 'Dependency or config change: running the full suite.'
            else
              since='HEAD^1'
              echo 'Running tests affected by this pull request.'
            fi
          fi
          echo "CHANGED_SINCE=$since" >> "$GITHUB_ENV"
      - name: Run tests
        if: inputs.pg-mode == 'nopg'
        # Branching rather than interpolating a flag string, so that the
        # arguments never depend on word splitting.
        run: |
          if [ -n "$CHANGED_SINCE" ]; then
            # A shard can legitimately end up with no files once the set is
            # narrowed, which is not a failure.
            pnpm run test --shard="$SHARD/$SHARD_COUNT" \
              --changed "$CHANGED_SINCE" --passWithNoTests
          else
            pnpm run test --shard="$SHARD/$SHARD_COUNT"
          fi
      # PG tests are retried because the Postgres-backed suites are flakier.
      - name: Run tests
        if: inputs.pg-mode != 'nopg'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            if [ -n "$CHANGED_SINCE" ]; then
              pnpm run test --shard="$SHARD/$SHARD_COUNT" \
                --changed "$CHANGED_SINCE" --passWithNoTests
            else
              pnpm run test --shard="$SHARD/$SHARD_COUNT"
            fi
