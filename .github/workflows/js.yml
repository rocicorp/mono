name: JS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast preflight checks. Expensive jobs wait on these to avoid wasted CI minutes.
  syncpack:
    name: Sync Package Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-
      - run: pnpm install --frozen-lockfile --filter @rocicorp/mono --ignore-scripts
      - run: pnpm exec syncpack lint

  verify-deps:
    name: Verify Package Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-verify-deps-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-verify-deps-
      - run: pnpm install --frozen-lockfile --filter verify-package-deps --ignore-scripts
      - run: pnpm run verify-deps

  format:
    name: Oxfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-
      - run: pnpm install --frozen-lockfile --filter @rocicorp/mono --ignore-scripts
      - run: pnpm exec oxfmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-root-tools-
      - run: pnpm install --frozen-lockfile --filter @rocicorp/mono --ignore-scripts
      - run: pnpm run lint

  check-types:
    name: Check Types
    runs-on: ubuntu-latest
    needs: [syncpack, verify-deps, format, lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-types

  zero-docker:
    name: Build Zero Docker Image
    runs-on: ubuntu-latest
    needs: [syncpack, verify-deps, format, lint]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            pnpm-store-v11-${{ runner.os }}-${{ runner.arch }}-full-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rocicorp/zero run build
      - name: Pack Zero
        id: pack
        working-directory: packages/zero
        run: |
          node <<'EOF'
          const {execFileSync} = require('node:child_process');
          const {appendFileSync} = require('node:fs');

          const output = execFileSync(
            'npm',
            ['pack', '--pack-destination', 'pkgs', '--json'],
            {encoding: 'utf8'},
          );
          const [{filename}] = JSON.parse(output);
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\n`);
          EOF
      - name: Build Docker Image
        working-directory: packages/zero
        env:
          ZERO_TARBALL: ${{ steps.pack.outputs.filename }}
        run: docker buildx build --platform linux/amd64 --build-context monogo=../../go --build-arg=ZERO_VERSION="$ZERO_TARBALL" --progress=plain .

  test-nopg-shards:
    name: Test no PG
    needs: [syncpack, verify-deps, format, lint]
    uses: ./.github/workflows/js-test-shards.yml
    with:
      pg-mode: nopg

  test-pg-shards:
    name: Test PG ${{ matrix.pg-version }}
    needs: [syncpack, verify-deps, format, lint]
    strategy:
      fail-fast: false
      matrix:
        # The four Postgres versions are ~75% of this workflow's runner time,
        # and a pull request almost never breaks one version without breaking
        # the newest. Pull requests therefore test against 18 only, and the
        # full matrix runs in the merge queue and on main.
        #
        # This is safe because merging goes through a required merge queue, so
        # every commit is tested against all four versions before it lands --
        # the cost of a version-specific break is a rejected merge queue entry
        # instead of a red main. Only the gathering "Test" job is a required
        # check, so a shorter matrix does not leave a required check unreported.
        # The conditional picks between two strings rather than two arrays, so
        # it does not depend on how an array is coerced to a boolean.
        pg-version: ${{ fromJSON(github.event_name == 'pull_request' && '[18]' || '[18, 17, 16, 15]') }}
    uses: ./.github/workflows/js-test-shards.yml
    with:
      pg-mode: pg-${{ matrix.pg-version }}

  # Gathering jobs. "Test" is the only test check that branch rules need to
  # require. A skipped required check counts as passing on GitHub, so these run
  # whenever the workflow isn't cancelled and fail unless every shard succeeded.
  test-nopg:
    name: Test no PG
    runs-on: ubuntu-latest
    needs: [test-nopg-shards]
    if: ${{ !cancelled() }}
    env:
      RESULT: ${{ needs.test-nopg-shards.result }}
    steps:
      - run: |
          echo "Test no PG shards: $RESULT"
          [ "$RESULT" = success ]

  test-pg:
    name: Test PG
    runs-on: ubuntu-latest
    needs: [test-pg-shards]
    if: ${{ !cancelled() }}
    env:
      RESULT: ${{ needs.test-pg-shards.result }}
    steps:
      - run: |
          echo "Test PG shards: $RESULT"
          [ "$RESULT" = success ]

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-nopg, test-pg]
    if: ${{ !cancelled() }}
    env:
      NOPG_RESULT: ${{ needs.test-nopg.result }}
      PG_RESULT: ${{ needs.test-pg.result }}
    steps:
      - run: |
          echo "Test no PG: $NOPG_RESULT"
          echo "Test PG: $PG_RESULT"
          [ "$NOPG_RESULT" = success ] && [ "$PG_RESULT" = success ]
