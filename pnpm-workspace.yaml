  # @rocicorp/zero-previous (npm:@rocicorp/zero@1.11.0) is only used for its
  # client in zql-integration-tests; align its OpenTelemetry deps with the
  # workspace so it doesn't drag in old, vulnerable instrumentations.
  '@rocicorp/zero@1.11.0>@opentelemetry/api-logs': ^0.223.0
  '@rocicorp/zero@1.11.0>@opentelemetry/auto-instrumentations-node': ^0.81.2
  '@rocicorp/zero@1.11.0>@opentelemetry/exporter-metrics-otlp-http': ^0.223.0
  '@rocicorp/zero@1.11.0>@opentelemetry/resources': ^2.12.0
  '@rocicorp/zero@1.11.0>@opentelemetry/sdk-metrics': ^2.12.0
