\* A lease shorter than a real restore: it takes back a restore that is still
\* moving, which is then refused and restores again, forever.
SPECIFICATION SpecHealthyRestore
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = FALSE
    TruncateBelowBackup = FALSE
    SubscribeAtMajor = TRUE
    SeedStandsIn = TRUE
PROPERTY Prop_RestoreCompletes
CHECK_DEADLOCK FALSE
