\* A follower that subscribes at its whole watermark, as one below protocol v7
\* does, with no stand-in for the seed. The seed's own transaction serves it,
\* so subscribing at the major is what the stand-in exists for.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
    TruncateBelowBackup = FALSE
    SubscribeAtMajor = FALSE
    SeedStandsIn = FALSE
INVARIANT Safety
CHECK_DEADLOCK FALSE
