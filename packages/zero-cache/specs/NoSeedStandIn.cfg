\* The shipped configuration without `seedCatchupStart`: a follower subscribes
\* at its major, and nothing lets the seed stand in for it. A log reseeded at a
\* backfill minor then refuses every follower restored from a backup at the
\* seed, and the restore repeats. Retained as the regression case for that fix.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
    TruncateBelowBackup = FALSE
    SubscribeAtMajor = TRUE
    SeedStandsIn = FALSE
INVARIANT Safety
CHECK_DEADLOCK FALSE
