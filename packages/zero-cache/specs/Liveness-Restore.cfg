\* No lease: nothing ever takes a reservation back. A follower that stalls
\* mid-restore (FinishRestore is unfair) pins the change log forever.
\* Prop_NoPermanentPin is EXPECTED TO FAIL here -- this is the motivation for
\* capping the reservation age.
SPECIFICATION SpecHealthyRestore
CONSTANTS
    Tasks = {t1, t2}
    MaxWatermark = 3
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
PROPERTY Prop_RestoreCompletes
CHECK_DEADLOCK FALSE
