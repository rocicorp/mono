\* The lease is armed: a restore that stalls (FinishRestore is unfair) is
\* eventually taken back, so no reservation pins the change log forever.
SPECIFICATION SpecWithLease
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
    TruncateBelowBackup = FALSE
    SubscribeAtMajor = TRUE
    SeedStandsIn = TRUE
PROPERTY Prop_NoPermanentPin
CHECK_DEADLOCK FALSE
