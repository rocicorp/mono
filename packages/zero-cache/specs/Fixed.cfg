\* The shipped configuration: a reseed takes back every open reservation
\* (`SnapshotReservations.closeAll`), the confirm check reads minWatermark,
\* pause() waits out an in-flight purge batch, and a follower subscribes at its
\* major, which the seed stands in for while the log starts there.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
    TruncateBelowBackup = FALSE
    SubscribeAtMajor = TRUE
    SeedStandsIn = TRUE
INVARIANT Safety
CHECK_DEADLOCK FALSE
