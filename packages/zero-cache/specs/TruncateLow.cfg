\* Drops the assumption that a reconcile's resume watermark is at or above the
\* confirmed backup watermark. Safety fails, so that relationship is load
\* bearing: it is the reason a `truncated` reconcile needs no invalidation.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2}
    MaxMajor = 3
    MaxMinor = 1
    ConfirmUsesSeed = FALSE
    PauseWaitsForBatch = TRUE
    RevalidateOnConfirm = FALSE
    InvalidateOnReseed = TRUE
    LeaseCoversRestore = TRUE
    TruncateBelowBackup = TRUE
    SubscribeAtMajor = TRUE
    SeedStandsIn = TRUE
INVARIANT Safety
CHECK_DEADLOCK FALSE
